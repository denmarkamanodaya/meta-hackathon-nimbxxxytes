[package]
name = "nimbytes-desktop"
version = "1.0.3"
description = "nimbytes for Mac: the cloud library as a local folder, the full app in a window."
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

# Standalone workspace: the wire types come from the api workspace by path, nothing else is shared.
[workspace]

[lib]
name = "nimbytes_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
nimbytes-contracts = { path = "../../api/crates/contracts" }
nimbytes-core = { path = "../../api/crates/core" }
async-trait = "=0.1.92"
futures-util = "=0.3.34"
keyring = "=4.2.0"
nfsserve = "=0.11.0"
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-notification = "=2.7.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time", "fs", "io-util", "sync"] }
trash = "=5.2.9"
uuid = { version = "=1.29.0", features = ["v7"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
too_many_lines = "warn"

[profile.release]
strip = true
