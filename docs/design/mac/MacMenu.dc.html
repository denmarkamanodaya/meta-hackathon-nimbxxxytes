<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nimbytes menu bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.item{display:flex;align-items:center;justify-content:space-between;height:32px;padding:0 12px;border-radius:6px;font-size:13px;color:#0D1B1E;text-decoration:none}
.key{font-size:12px;color:#52646A}
.sep{height:1px;background:#DCE3E2;margin:4px 8px}
</style>
</helmet>
<div style="width: 320px; height: 400px; box-sizing: border-box; background: #F3F5F4; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; align-items: flex-end; padding: 14px">
  <div style="display: flex; align-items: center; justify-content: center; width: 34px; height: 24px; border-radius: 6px; background: #DCE3E2; margin-right: 18px" aria-label="nimbytes menu bar icon">
    <svg width="18" height="14" viewBox="0 0 64 48" aria-hidden="true"><path d="M16 42H50A11 11 0 0 0 50 20A15 15 0 0 0 21.5 16A13.5 13.5 0 0 0 16 42Z" fill="#0D1B1E"></path></svg>
  </div>
  <div role="menu" style="margin-top: 6px; width: 280px; border-radius: 12px; background: #FFFFFF; border: 1px solid #DCE3E2; box-shadow: 0 12px 32px rgba(15,23,42,.14); padding: 6px; box-sizing: border-box">
    <div style="padding: 8px 12px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #0F7A4F"></span>nimbytes is up to date</span>
      <span style="font-size: 12px; color: #52646A">4 clips · 1 original offline · 1 upload in progress</span>
    </div>
    <div class="sep"></div>
    <a role="menuitem" href="#" class="item" style="background: #E2F1F4"><span>Sync now</span><span class="key">⌘R</span></a>
    <a role="menuitem" href="#" class="item"><span>Open nimbytes folder</span><span class="key">⌘⇧O</span></a>
    <a role="menuitem" href="MacLibrary.dc.html" class="item"><span>Open window</span><span class="key">⌘0</span></a>
    <div class="sep"></div>
    <a role="menuitem" href="#" class="item"><span>Launch at login</span><span class="key">✓</span></a>
    <div class="sep"></div>
    <a role="menuitem" href="#" class="item"><span>Quit nimbytes</span><span class="key">⌘Q</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":320,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
