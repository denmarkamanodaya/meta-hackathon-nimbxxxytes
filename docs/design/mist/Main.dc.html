<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nimbytes Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6E85}a:hover{color:#08566A}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.tile{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:3/4}
.dur{position:absolute;left:6px;bottom:6px;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.58);color:#fff;font-size:11px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:#FFFFFF;border:1px solid #DCE3E2;color:#0D1B1E;font-size:14px;white-space:nowrap}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F4; font-family: Geist, system-ui, sans-serif; color: #0D1B1E; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 8px">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="9" cy="15" r="6" fill="none" stroke="{{accent}}" stroke-width="2.4"></circle><circle cx="16.5" cy="11" r="7" fill="none" stroke="{{accent}}" stroke-width="2.4"></circle></svg>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.02em">nimbytes</span>
    </div>
    <button aria-label="Settings and costs" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #DCE3E2; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D1B1E" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
    </button>
  </header>

  <section aria-label="Storage" style="margin: 8px 16px 0; padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #DCE3E2; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #52646A">In your cloud</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.02em">41.2 GB</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; align-items: flex-end">
        <span style="font-size: 13px; color: #52646A">On this phone</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.02em; color: {{accent}}">0 GB</span>
      </div>
    </div>
    <div style="display: flex; height: 8px; border-radius: 999px; overflow: hidden; gap: 2px" aria-hidden="true">
      <div style="flex: 6; background: {{accent}}"></div>
      <div style="flex: 35; background: #A9CCD4"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #52646A">
      <span><span style="display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: {{accent}}; margin-right: 6px"></span>Watched lately 6 GB</span>
      <span><span style="display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: #A9CCD4; margin-right: 6px"></span>Resting, cheaper 35 GB</span>
    </div>
  </section>

  <a href="Search.dc.html" style="margin: 12px 16px 0; height: 52px; border-radius: 16px; background: #0D1B1E; color: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 16px; text-decoration: none">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <span style="font-size: 16px; color: #C9D3D6">Ask your footage anything…</span>
  </a>
  <div style="display: flex; gap: 8px; padding: 10px 16px 0; overflow: hidden">
    <span class="chip">coffee this morning</span>
    <span class="chip">Sam laughing</span>
    <span class="chip">the purple coupe</span>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 18px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700">Today</h2>
      <span style="font-size: 13px; color: #52646A">4 clips · 6 min</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <a href="Clip.dc.html" class="tile" style="background: #C9A08A"><span class="dur mono">0:42</span></a>
      <div class="tile" style="background: #9DBFC6"><span class="dur mono">1:18</span></div>
      <div class="tile" style="background: #A9B38F"><span class="dur mono">2:05</span></div>
      <div class="tile" style="background: #D9CBB4; display: flex; align-items: flex-end">
        <div style="position: absolute; inset: 0; background: rgba(13,27,30,.48)"></div>
        <div style="position: relative; padding: 8px; display: flex; flex-direction: column; gap: 6px; width: 100%; box-sizing: border-box">
          <span style="color: #FFFFFF; font-size: 12px; font-weight: 600">Understanding…</span>
          <div style="height: 4px; border-radius: 999px; background: rgba(255,255,255,.35)"><div style="width: 60%; height: 4px; border-radius: 999px; background: #FFFFFF"></div></div>
        </div>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700">Yesterday</h2>
      <span style="font-size: 13px; color: #52646A">9 clips · 14 min</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div class="tile" style="background: #8E9AA6"><span class="dur mono">0:57</span></div>
      <div class="tile" style="background: #7F8DA8"><span class="dur mono">3:12</span></div>
      <div class="tile" style="background: #B9C4A0"><span class="dur mono">1:40</span></div>
    </div>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: rgba(255,255,255,.94); border-top: 1px solid #DCE3E2; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; padding-top: 8px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: {{accent}}; text-decoration: none; min-height: 44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7.5" height="9" rx="2"></rect><rect x="13.5" y="3" width="7.5" height="9" rx="2"></rect><rect x="3" y="15" width="18" height="6" rx="2"></rect></svg>Library</a>
    <a href="Search.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #52646A; text-decoration: none; min-height: 44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#52646A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Search</a>
    <a href="Upload.dc.html" aria-label="Upload clips" style="display: flex; justify-content: center; text-decoration: none">
      <span style="width: 52px; height: 52px; border-radius: 18px; background: {{accent}}; display: flex; align-items: center; justify-content: center; margin-top: -4px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </span></a>
    <a href="Short.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #52646A; text-decoration: none; min-height: 44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#52646A" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"></rect><path d="m10 9 5 3-5 3z"></path></svg>Shorts</a>
    <a href="People.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #52646A; text-decoration: none; min-height: 44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#52646A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M17 14.5c2.3 0 3.8 1.5 4.5 4"></path></svg>People</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B6E85","options":["#0B6E85","#1F5FD1","#B4432E","#2F7A3D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0B6E85' };
  }
}
</script>
</body>
</html>
