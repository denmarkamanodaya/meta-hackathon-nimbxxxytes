<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["gallery","faces","birthday","trip","shorts","productions","guides","settings"],"default":"gallery"},"$preview":{"width":208,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'gallery';
    const base = 'display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 6px; text-decoration: none; font-size: 13px; ';
    const on = base + 'color: #1ed2dc; font-weight: 600';
    const off = base + 'color: #d6d6d6; font-weight: 500';
    const keys = ['gallery', 'faces', 'birthday', 'trip', 'shorts', 'productions', 'guides', 'settings'];
    const s = {};
    keys.forEach((k) => { s[k] = k === active ? on : off; });
    return { s };
  }
}
