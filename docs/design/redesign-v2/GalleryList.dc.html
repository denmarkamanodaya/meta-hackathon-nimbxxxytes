<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gallery list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:#000000}</style>
</helmet>
<div style="position: relative; min-height: 900px; font-family: 'Geist', system-ui, sans-serif; color: #ffffff; font-size: 13px">
  <dc-import name="Main" view="list" tab="speech" hint-size="100%,900px"></dc-import>

  <div role="menu" aria-label="60th birthday celebration" style="position: absolute; left: 470px; top: 372px; width: 232px; padding: 4px; border-radius: 8px; background: #282828; border: 1px solid #3e3e3e; box-shadow: 0 16px 40px rgb(0 0 0 / 60%); display: flex; flex-direction: column">
    <button type="button" role="menuitem" style="display: flex; align-items: center; height: 26px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: #ffffff; font: inherit; font-size: 12px; text-align: left; cursor: pointer"><span style="flex-grow: 1">Open</span><span style="color: #a7a7a7; font-family: 'Geist Mono', monospace; font-size: 11px">⏎</span></button>
    <button type="button" role="menuitem" style="display: flex; align-items: center; height: 26px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: #ffffff; font: inherit; font-size: 12px; text-align: left; cursor: pointer"><span style="flex-grow: 1">Quick look</span><span style="color: #a7a7a7; font-family: 'Geist Mono', monospace; font-size: 11px">Space</span></button>
    <button type="button" role="menuitem" style="display: flex; align-items: center; height: 26px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: #ffffff; font: inherit; font-size: 12px; text-align: left; cursor: pointer"><span style="flex-grow: 1">Make a short</span></button>
    <span style="height: 1px; background: #3e3e3e; margin: 4px 6px"></span>
    <button type="button" role="menuitem" aria-haspopup="menu" aria-expanded="true" style="display: flex; align-items: center; height: 26px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: #1ed2dc; font: inherit; font-size: 12px; font-weight: 600; text-align: left; cursor: pointer">
      <span style="flex-grow: 1">Add to project</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    </button>
    <button type="button" role="menuitem" style="display: flex; align-items: center; height: 26px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: #ffffff; font: inherit; font-size: 12px; text-align: left; cursor: pointer"><span style="flex-grow: 1">Make available offline</span></button>
    <button type="button" role="menuitem" style="display: flex; align-items: center; height: 26px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: #ffffff; font: inherit; font-size: 12px; text-align: left; cursor: pointer"><span style="flex-grow: 1">Show in Finder</span><span style="color: #a7a7a7; font-family: 'Geist Mono', monospace; font-size: 11px">⌘R</span></button>
    <span style="height: 1px; background: #3e3e3e; margin: 4px 6px"></span>
    <button type="button" role="menuitem" style="display: flex; align-items: center; height: 26px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: #ff7a6b; font: inherit; font-size: 12px; text-align: left; cursor: pointer"><span style="flex-grow: 1">Delete…</span><span style="color: #a7a7a7; font-family: 'Geist Mono', monospace; font-size: 11px">⌘⌫</span></button>
  </div>

  <div role="menu" aria-label="Add to project" style="position: absolute; left: 706px; top: 446px; width: 208px; padding: 4px; border-radius: 8px; background: #282828; border: 1px solid #3e3e3e; box-shadow: 0 16px 40px rgb(0 0 0 / 60%); display: flex; flex-direction: column">
    <button type="button" role="menuitemcheckbox" aria-checked="true" style="display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: #ffffff; font: inherit; font-size: 12px; text-align: left; cursor: pointer">
      <span style="width: 8px; height: 8px; border-radius: 2px; background: #ffa94d"></span>
      <span style="flex-grow: 1">60th birthday</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1ed2dc" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Added"><path d="m5 12 5 5 9-10"></path></svg>
    </button>
    <button type="button" role="menuitemcheckbox" aria-checked="false" style="display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: #ffffff; font: inherit; font-size: 12px; text-align: left; cursor: pointer">
      <span style="width: 8px; height: 8px; border-radius: 2px; background: #3ddc84"></span>
      <span style="flex-grow: 1">Australia trip</span>
    </button>
    <span style="height: 1px; background: #3e3e3e; margin: 4px 6px"></span>
    <a href="Projects.dc.html" role="menuitem" style="display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border-radius: 5px; color: #ffffff; font-size: 12px; text-decoration: none">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      New project…
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
