<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Faces</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:#000000}</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 900px; background: #121212; font-family: 'Geist', system-ui, sans-serif; color: #ffffff; font-size: 13px">
  <div style="flex: 0 0 208px; display: flex">
    <dc-import name="Sidebar" active="faces" hint-size="208px,900px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid #242424; flex-wrap: wrap">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600">Faces</h1>
      <span style="color: #a7a7a7; font-size: 12px">35 faces in 1 clip · none named yet</span>
      <div style="flex-grow: 1"></div>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #d6d6d6">
        Suggest matches
        <button type="button" aria-pressed="false" aria-label="Suggest matching faces" style="position: relative; width: 32px; height: 18px; border-radius: 9px; border: 0; padding: 0; background: #3e3e3e; cursor: pointer"><span style="position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 7px; background: #ffffff"></span></button>
      </span>
    </header>
    <div style="display: flex; align-items: center; gap: 6px; padding: 10px 20px">
      <button type="button" aria-pressed="true" style="height: 24px; padding: 0 10px; border-radius: 12px; border: 1px solid #1ed2dc; background: transparent; color: #1ed2dc; font: inherit; font-size: 12px; font-weight: 600">All 35</button>
      <button type="button" aria-pressed="false" style="height: 24px; padding: 0 10px; border-radius: 12px; border: 1px solid #3e3e3e; background: transparent; color: #d6d6d6; font: inherit; font-size: 12px">Named 0</button>
      <button type="button" aria-pressed="false" style="height: 24px; padding: 0 10px; border-radius: 12px; border: 1px solid #3e3e3e; background: transparent; color: #d6d6d6; font: inherit; font-size: 12px">Not named 35</button>
      <button type="button" aria-pressed="false" style="height: 24px; padding: 0 10px; border-radius: 12px; border: 1px solid #3e3e3e; background: transparent; color: #d6d6d6; font: inherit; font-size: 12px">Hidden 0</button>
    </div>
    <ul style="list-style: none; margin: 0; padding: 6px 20px 24px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{faces}}" as="f" hint-placeholder-count="21">
        <li style="display: flex; flex-direction: column; gap: 5px; min-width: 0">
          <button type="button" aria-label="{{f.label}}" style="{{f.boxStyle}}">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7c7c7c" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
          </button>
          <span style="font-size: 12px; color: #a7a7a7">Name?</span>
          <span style="font-size: 11px; color: #7c7c7c; margin-top: -3px; font-family: 'Geist Mono', monospace">{{f.when}}</span>
        </li>
      </sc-for>
    </ul>
  </main>

  <aside aria-label="Selected face" style="flex: 1 1 320px; max-width: 360px; min-width: 0; background: #181818; border-left: 1px solid #242424; display: flex; flex-direction: column; gap: 14px; padding: 16px">
    <span style="width: 120px; aspect-ratio: 1 / 1; border-radius: 8px; background: #2e2e2e; display: flex; align-items: center; justify-content: center">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#7c7c7c" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
    </span>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #d6d6d6">
      Who is this?
      <span style="display: flex; gap: 6px">
        <input type="text" placeholder="Name" style="flex-grow: 1; min-width: 0; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid #3e3e3e; background: #121212; color: #ffffff; font: inherit; font-size: 12px; box-sizing: border-box">
        <button type="button" style="height: 28px; padding: 0 12px; border-radius: 6px; border: 0; background: #1ed2dc; color: #000000; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">Save</button>
      </span>
    </label>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; font-weight: 600; color: #a7a7a7; letter-spacing: 0.06em; text-transform: uppercase">Seen in</span>
      <a href="Player.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 6px; text-decoration: none; color: #ffffff">
        <span style="width: 40px; height: 40px; border-radius: 4px; background: #2a2224; flex: 0 0 40px"></span>
        <span style="display: flex; flex-direction: column; min-width: 0">
          <span style="font-size: 12px; font-weight: 500">60th birthday celebration</span>
          <span style="font-size: 11px; color: #a7a7a7; font-family: 'Geist Mono', monospace">0:07 – 0:08</span>
        </span>
      </a>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex-grow: 1; display: flex; flex-direction: column">
        <span style="font-size: 12px; font-weight: 500">Hide this face</span>
        <span style="font-size: 11px; color: #a7a7a7">Blurred in shorts and previews</span>
      </div>
      <button type="button" aria-pressed="false" aria-label="Hide this face" style="position: relative; width: 32px; height: 18px; border-radius: 9px; border: 0; padding: 0; background: #3e3e3e; cursor: pointer"><span style="position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 7px; background: #ffffff"></span></button>
    </div>
    <div style="flex-grow: 1"></div>
    <button type="button" style="height: 32px; border: 0; border-radius: 6px; background: #1ed2dc; color: #000000; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Make a short with this face</button>
    <div style="display: flex; gap: 6px">
      <button type="button" style="flex-grow: 1; height: 28px; border-radius: 6px; border: 1px solid #3e3e3e; background: #242424; color: #ffffff; font: inherit; font-size: 12px; cursor: pointer">Same person as…</button>
      <button type="button" style="flex-grow: 1; height: 28px; border-radius: 6px; border: 1px solid #3e3e3e; background: #242424; color: #ffffff; font: inherit; font-size: 12px; cursor: pointer">Not a face</button>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const whens = ['0:07', '0:14', '0:22', '0:23', '0:28', '0:30', '0:34', '0:43', '0:44', '0:49', '0:57', '1:03', '1:10', '1:16', '1:25', '1:31', '1:40', '1:52', '2:05', '2:19', '2:33'];
    const faces = whens.map((when, i) => ({
      when,
      label: 'Face at ' + when + ', not named',
      boxStyle: 'display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; border: 0; padding: 0; background: #242424; cursor: pointer;' + (i === 0 ? ' outline: 2px solid #1ed2dc; outline-offset: 2px;' : '')
    }));
    return { faces };
  }
}
</script>
</body>
</html>
