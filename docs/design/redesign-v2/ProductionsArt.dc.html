<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Productions art</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:#000000}</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 900px; background: #121212; font-family: 'Geist', system-ui, sans-serif; color: #ffffff; font-size: 13px">
  <div style="flex: 0 0 208px; display: flex">
    <dc-import name="Sidebar" active="productions" hint-size="208px,900px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid #242424; flex-wrap: wrap">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600">Productions</h1>
      <span style="color: #a7a7a7; font-size: 12px">Plan a story, film what is missing, cut it.</span>
      <div style="flex-grow: 1"></div>
      <button type="button" style="height: 28px; padding: 0 12px; border-radius: 6px; border: 0; background: #1ed2dc; color: #000000; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">New production</button>
    </header>

    <ul style="list-style: none; margin: 0; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <li>
          <button type="button" onClick="{{r.pick}}" style="{{r.rowStyle}}">
            <span style="{{r.thumb}}">
              <span style="{{r.thumbSun}}"></span>
              <span style="{{r.thumbLand}}"></span>
            </span>
            <span style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 4px; text-align: left">
              <span style="display: flex; align-items: center; gap: 8px">
                <span style="font-size: 13px; font-weight: 600; color: #ffffff">{{r.title}}</span>
                <span style="height: 18px; padding: 0 7px; border-radius: 9px; background: #2e2e2e; color: #d6d6d6; font-size: 11px; font-weight: 600; display: flex; align-items: center">{{r.kind}}</span>
                <span style="{{r.chip}}">{{r.status}}</span>
              </span>
              <span style="font-size: 12px; color: #a7a7a7">{{r.sub}}</span>
            </span>
            <span style="flex: 0 0 220px; display: flex; flex-direction: column; gap: 5px; text-align: left">
              <span style="font-size: 12px; color: #d6d6d6">{{r.cover}}</span>
              <span style="height: 4px; border-radius: 2px; background: #3e3e3e; display: block"><span style="{{r.bar}}"></span></span>
            </span>
          </button>
        </li>
      </sc-for>
    </ul>
  </main>

  <aside aria-label="Selected production" style="flex: 1 1 320px; max-width: 360px; min-width: 0; background: #181818; border-left: 1px solid #242424; display: flex; flex-direction: column">
    <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
      <span style="{{sel.art}}">
        <span style="{{sel.sun}}"></span>
        <span style="{{sel.land}}"></span>
        <sc-if value="{{sel.drawing}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; inset: 0; background: rgb(18 18 18 / 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: #d6d6d6">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1ed2dc" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg>
            Drawing key art…
          </span>
        </sc-if>
      </span>
      <span style="font-size: 11px; color: #a7a7a7">{{sel.note}}</span>
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">{{sel.title}}</h2>
      <p style="margin: 0; font-size: 12px; color: #d6d6d6; line-height: 1.45">{{sel.sub}}</p>
      <div style="display: flex; gap: 6px">
        <button type="button" onClick="{{newArt}}" style="flex-grow: 1; height: 28px; border-radius: 6px; border: 1px solid #3e3e3e; background: #242424; color: #ffffff; font: inherit; font-size: 12px; cursor: pointer">New art · $0.01</button>
        <button type="button" style="flex-grow: 1; height: 28px; border-radius: 6px; border: 1px solid #3e3e3e; background: #242424; color: #ffffff; font: inherit; font-size: 12px; cursor: pointer">Use as cover</button>
      </div>
    </div>
    <div style="padding: 12px 16px 16px; border-top: 1px solid #2e2e2e; display: flex; flex-direction: column; gap: 8px">
      <button type="button" style="height: 32px; border: 0; border-radius: 6px; background: #1ed2dc; color: #000000; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Open production</button>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 0, drawing: -1 };
  }
  renderVals() {
    const st = this.state;
    const raw = [
      { title: 'Sixty and shining', kind: 'Story · 60 s', status: 'Ready', ok: true, sub: 'Created 28 Oct 2026 · short cut', cover: '5 of 6 shots covered · 1 to film', pct: 83, look: { sky: '#f3d7c4', sun: '#ffffff', land: '#b4485e' }, hasArt: true },
      { title: 'Opening day at the café', kind: 'Recap · 45 s', status: 'Shooting', ok: false, sub: 'Created 28 Oct 2026', cover: '3 of 5 shots covered · 2 to film', pct: 60, look: { sky: '#d9c2a3', sun: '#fff3d6', land: '#5a3a26' }, hasArt: true },
      { title: 'Sunday with Biscuit', kind: 'Story · 30 s', status: 'Planning', ok: false, sub: 'Created 28 Oct 2026', cover: 'Planning shots…', pct: 10, look: { sky: '#2e2e2e', sun: '#3e3e3e', land: '#242424' }, hasArt: false }
    ];
    const rowBase = 'display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px; border: 0; border-radius: 6px; font: inherit; cursor: pointer; flex-wrap: wrap; ';
    const chipBase = 'height: 18px; padding: 0 7px; border-radius: 9px; font-size: 11px; font-weight: 600; display: flex; align-items: center; ';
    const rows = raw.map((r, i) => ({
      ...r,
      chip: chipBase + (r.ok ? 'background: rgb(61 220 132 / 16%); color: #5be39a' : 'background: rgb(255 169 77 / 14%); color: #ffa94d'),
      bar: 'display: block; width: ' + r.pct + '%; height: 4px; border-radius: 2px; background: #1ed2dc',
      thumb: 'position: relative; width: 48px; height: 48px; flex: 0 0 48px; border-radius: 4px; overflow: hidden; display: block; background: ' + r.look.sky,
      thumbSun: 'position: absolute; right: 6px; top: 6px; width: 12px; height: 12px; border-radius: 6px; background: ' + r.look.sun,
      thumbLand: 'position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: ' + r.look.land,
      rowStyle: rowBase + (i === st.picked ? 'background: #1e2a2b;' : 'background: transparent;'),
      pick: () => this.setState({ picked: i })
    }));
    const p = raw[st.picked];
    const sel = {
      title: p.title,
      sub: p.kind + ' · ' + p.cover,
      drawing: st.drawing === st.picked,
      note: p.hasArt ? 'Key art · drawn by Muse Image from the covered shots, no text' : 'Key art is drawn once planning finishes',
      art: 'position: relative; display: block; width: 100%; aspect-ratio: 4 / 5; max-height: 340px; border-radius: 6px; overflow: hidden; background: ' + p.look.sky,
      sun: 'position: absolute; right: 16%; top: 14%; width: 56px; height: 56px; border-radius: 28px; background: ' + p.look.sun,
      land: 'position: absolute; left: 0; right: 0; bottom: 0; height: 42%; background: ' + p.look.land + '; border-radius: 40% 60% 0 0'
    };
    return { rows, sel, newArt: () => this.setState({ drawing: st.picked }) };
  }
}
</script>
</body>
</html>
