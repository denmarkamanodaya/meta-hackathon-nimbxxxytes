<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cut out</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:#000000}</style>
</helmet>
<div style="position: relative; display: flex; flex-wrap: wrap; min-height: 900px; background: #121212; font-family: 'Geist', system-ui, sans-serif; color: #ffffff; font-size: 13px">
  <div style="flex: 0 0 208px; display: flex">
    <dc-import name="Sidebar" active="gallery" hint-size="208px,900px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-bottom: 1px solid #242424">
      <span style="font-size: 12px; color: #d6d6d6">Gallery</span>
      <span style="color: #3e3e3e">/</span>
      <h1 style="margin: 0; font-size: 14px; font-weight: 600">Sleepy old dog</h1>
    </header>
    <div style="padding: 16px 20px">
      <div style="position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 520px; border-radius: 8px; background: #3a3f44; overflow: hidden">
        <span style="position: absolute; left: 30%; top: 30%; width: 40%; height: 46%; border-radius: 50% 46% 30% 30%; background: #b9875a"></span>
      </div>
    </div>
  </main>

  <div style="position: absolute; inset: 0; background: rgb(0 0 0 / 55%); display: flex; align-items: center; justify-content: center">
    <div role="dialog" aria-label="Cut out" style="width: 560px; max-width: calc(100% - 32px); border-radius: 12px; background: #1e1e1e; border: 1px solid #3e3e3e; box-shadow: 0 24px 60px rgb(0 0 0 / 60%); display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #2e2e2e">
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 600">Cut out · dog</span>
          <span style="font-size: 12px; color: #a7a7a7">From 0:12 · cut out by SAM 3.1</span>
        </span>
        <button type="button" aria-label="Close" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #d6d6d6; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </button>
      </div>
      <div style="padding: 16px; display: flex; gap: 16px; flex-wrap: wrap">
        <span style="position: relative; display: block; width: 260px; height: 260px; border-radius: 8px; overflow: hidden; background-color: #2a2a2a; background-image: linear-gradient(45deg, #3a3a3a 25%, transparent 25%, transparent 75%, #3a3a3a 75%), linear-gradient(45deg, #3a3a3a 25%, transparent 25%, transparent 75%, #3a3a3a 75%); background-size: 20px 20px; background-position: 0 0, 10px 10px">
          <span style="{{body}}"></span>
          <span style="{{head}}"></span>
          <span style="{{ear}}"></span>
        </span>
        <div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
              <span style="font-weight: 500">Sticker</span>
              <span style="font-size: 12px; color: #a7a7a7">Adds a white outline</span>
            </span>
            <button type="button" role="switch" aria-checked="{{stickerOn}}" aria-label="Sticker" onClick="{{toggle}}" style="{{switchStyle}}"><span style="{{knobStyle}}"></span></button>
          </div>
          <span style="font-size: 12px; color: #a7a7a7">Transparent PNG at full size · $0.0025</span>
          <span style="font-size: 12px; color: #a7a7a7">Wrong thing? Click Find this on the player and pick it instead.</span>
        </div>
      </div>
      <div style="display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid #2e2e2e">
        <button type="button" style="height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid #3e3e3e; background: #242424; color: #ffffff; font: inherit; font-size: 12px; cursor: pointer">Copy</button>
        <button type="button" style="height: 30px; padding: 0 12px; border-radius: 6px; border: 0; background: #1ed2dc; color: #000000; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">Download PNG</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sticker: false };
  }
  renderVals() {
    const s = this.state.sticker;
    const ring = s ? 'box-shadow: 0 0 0 6px #ffffff; ' : '';
    return {
      stickerOn: s ? 'true' : 'false',
      toggle: () => this.setState({ sticker: !s }),
      body: 'position: absolute; left: 18%; top: 44%; width: 66%; height: 40%; border-radius: 48% 44% 30% 30%; background: #b9875a; ' + ring,
      head: 'position: absolute; left: 12%; top: 22%; width: 36%; height: 32%; border-radius: 50% 46% 40% 50%; background: #c9a07a; ' + ring,
      ear: 'position: absolute; left: 34%; top: 18%; width: 12%; height: 20%; border-radius: 40% 60% 50% 50%; background: #8f6a48; ' + ring,
      switchStyle: 'position: relative; width: 34px; height: 20px; flex: 0 0 34px; border-radius: 10px; border: 0; padding: 0; cursor: pointer; background: ' + (s ? '#1ed2dc' : '#3e3e3e'),
      knobStyle: 'position: absolute; top: 2px; ' + (s ? 'left: 16px' : 'left: 2px') + '; width: 16px; height: 16px; border-radius: 8px; background: #ffffff'
    };
  }
}
</script>
</body>
</html>
