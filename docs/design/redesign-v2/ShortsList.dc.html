<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shorts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:#000000}</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 900px; background: #121212; font-family: 'Geist', system-ui, sans-serif; color: #ffffff; font-size: 13px">
  <div style="flex: 0 0 208px; display: flex">
    <dc-import name="Sidebar" active="shorts" hint-size="208px,900px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; min-height: 900px">
    <header style="display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid #242424; flex-wrap: wrap">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600">Shorts</h1>
      <span style="color: #a7a7a7; font-size: 12px">{{countLine}}</span>
      <div style="flex-grow: 1"></div>
      <sc-if value="{{hasShorts}}" hint-placeholder-val="{{true}}">
        <span style="display: flex; gap: 6px">
          <button type="button" aria-pressed="true" style="height: 24px; padding: 0 10px; border-radius: 12px; border: 1px solid #1ed2dc; background: transparent; color: #1ed2dc; font: inherit; font-size: 12px; font-weight: 600">All</button>
          <button type="button" aria-pressed="false" style="height: 24px; padding: 0 10px; border-radius: 12px; border: 1px solid #3e3e3e; background: transparent; color: #d6d6d6; font: inherit; font-size: 12px">Ready</button>
          <button type="button" aria-pressed="false" style="height: 24px; padding: 0 10px; border-radius: 12px; border: 1px solid #3e3e3e; background: transparent; color: #d6d6d6; font: inherit; font-size: 12px">From productions</button>
        </span>
      </sc-if>
    </header>

    <div style="flex-grow: 1; padding: 8px 20px 24px">
      <sc-if value="{{hasShorts}}" hint-placeholder-val="{{true}}">
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
          <sc-for list="{{shorts}}" as="s" hint-placeholder-count="2">
            <li>
              <button type="button" onClick="{{s.pick}}" style="{{s.rowStyle}}">
                <span style="{{s.thumb}}">
                  <span style="position: absolute; right: 3px; bottom: 3px; padding: 0 4px; border-radius: 3px; background: rgb(0 0 0 / 70%); font-family: 'Geist Mono', monospace; font-size: 10px; color: #ffffff">{{s.len}}</span>
                </span>
                <span style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 4px; text-align: left">
                  <span style="display: flex; align-items: center; gap: 8px; min-width: 0">
                    <span style="font-size: 13px; font-weight: 600; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.title}}</span>
                    <span style="flex: 0 0 auto; height: 18px; padding: 0 7px; border-radius: 9px; background: #2e2e2e; color: #d6d6d6; font-size: 11px; font-weight: 600; display: flex; align-items: center">{{s.shape}}</span>
                  </span>
                  <span style="font-size: 12px; color: #a7a7a7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.sub}}</span>
                </span>
                <span style="flex: 0 0 90px; font-size: 12px; color: #a7a7a7; text-align: left">{{s.draft}}</span>
                <span style="flex: 0 0 auto; font-size: 12px; color: #a7a7a7; font-family: 'Geist Mono', monospace">{{s.score}}</span>
                <span style="{{s.chipStyle}}">{{s.status}}</span>
                <span aria-hidden="true" style="width: 28px; height: 28px; flex: 0 0 28px; border-radius: 6px; border: 1px solid #3e3e3e; color: #ffffff; display: flex; align-items: center; justify-content: center">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg>
                </span>
              </button>
            </li>
          </sc-for>
        </ul>
      </sc-if>
      <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
        <div style="max-width: 420px; margin: 120px auto 0; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
          <span style="width: 40px; height: 40px; border-radius: 10px; background: #242424; color: #1ed2dc; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"></path></svg>
          </span>
          <h2 style="margin: 0; font-size: 14px; font-weight: 600">No shorts yet</h2>
          <p style="margin: 0; font-size: 12px; color: #a7a7a7; line-height: 1.5">Search for moments below, select the ones you like, and the editor cuts, captions and critiques a draft.</p>
          <span style="display: flex; gap: 8px; padding-top: 4px">
            <button type="button" style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 6px; border: 0; background: #1ed2dc; color: #000000; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
              Find moments
            </button>
            <a href="ProductionsList.dc.html" style="display: flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 6px; border: 1px solid #3e3e3e; color: #ffffff; text-decoration: none; font-size: 12px">Plan a production</a>
          </span>
          <span style="font-size: 11px; color: #a7a7a7; padding-top: 4px">Find moments puts the cursor in the search bar ↓</span>
        </div>
      </sc-if>
    </div>

    <dc-import name="SearchBar" open="{{searchOpen}}" hint-size="100%,64px"></dc-import>
  </main>

  <sc-if value="{{hasShorts}}" hint-placeholder-val="{{true}}">
    <aside aria-label="Selected short" style="flex: 1 1 320px; max-width: 360px; min-width: 0; background: #181818; border-left: 1px solid #242424; display: flex; flex-direction: column">
      <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
        <a href="ShortPage.dc.html" aria-label="Play {{sel.title}}" style="{{sel.preview}}">
          <span style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; border-radius: 20px; background: rgb(0 0 0 / 60%); display: flex; align-items: center; justify-content: center">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z" fill="#ffffff"></path></svg>
          </span>
        </a>
        <h2 style="margin: 0; font-size: 14px; font-weight: 600">{{sel.title}}</h2>
        <p style="margin: 0; font-size: 12px; color: #a7a7a7">{{sel.sub}}</p>
        <p style="margin: 0; font-size: 12px; color: #1ed2dc">{{sel.tags}}</p>
      </div>
      <div style="padding: 12px 16px 16px; border-top: 1px solid #2e2e2e; display: flex; flex-direction: column; gap: 8px">
        <a href="ShortPage.dc.html" style="display: flex; align-items: center; justify-content: center; height: 32px; border-radius: 6px; background: #1ed2dc; color: #000000; text-decoration: none; font-size: 13px; font-weight: 600">Open</a>
        <div style="display: flex; gap: 6px">
          <button type="button" style="flex-grow: 1; height: 28px; border-radius: 6px; border: 1px solid #3e3e3e; background: #242424; color: #ffffff; font: inherit; font-size: 12px; cursor: pointer">Publish…</button>
          <button type="button" style="flex-grow: 1; height: 28px; border-radius: 6px; border: 1px solid #3e3e3e; background: #242424; color: #ffffff; font: inherit; font-size: 12px; cursor: pointer">Download</button>
        </div>
      </div>
    </aside>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"empty":{"editor":"boolean","default":false},"searchOpen":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 0 };
  }
  renderVals() {
    const empty = this.props.empty === true;
    const raw = [
      { title: 'my old soul napping hard today', shape: '1:1', len: '0:10', sub: '“3 second short” · made 28 Oct 2026', draft: 'Draft 1', score: '– / 50', status: 'Ready', kind: 'ok', tone: '#2b2620', square: true, tags: '#seniordog #naptime #doglife' },
      { title: 'Sixty years of love, laughter, and family', shape: '4:5', len: '1:00', sub: 'From production “Sixty and shining” · made 28 Oct 2026', draft: 'Draft 1', score: '– / 50', status: 'Rendering', kind: 'busy', tone: '#2a2224', square: false, tags: 'What a night to remember' }
    ];
    const chip = 'flex: 0 0 auto; height: 20px; padding: 0 8px; border-radius: 10px; font-size: 11px; font-weight: 600; display: flex; align-items: center; ';
    const shorts = empty ? [] : raw.map((s, i) => ({
      ...s,
      thumb: 'position: relative; display: block; width: 48px; height: 48px; flex: 0 0 48px; border-radius: 4px; background: ' + s.tone,
      chipStyle: chip + (s.kind === 'ok' ? 'background: rgb(61 220 132 / 16%); color: #5be39a' : 'background: #242424; color: #d6d6d6'),
      rowStyle: 'display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px; border: 0; border-radius: 6px; font: inherit; cursor: pointer; ' + (i === this.state.picked ? 'background: #1e2a2b;' : 'background: transparent;'),
      pick: () => this.setState({ picked: i })
    }));
    const p = raw[this.state.picked];
    return {
      searchOpen: this.props.searchOpen === true,
      hasShorts: !empty,
      isEmpty: empty,
      countLine: empty ? 'Every cut the editor made, newest first.' : '2 shorts · newest first',
      shorts,
      sel: {
        title: p.title,
        sub: p.shape + ' · ' + p.len + ' · ' + p.draft + ' · ' + p.status,
        tags: p.tags,
        preview: 'position: relative; display: block; width: 100%; aspect-ratio: ' + (p.square ? '1 / 1' : '4 / 5') + '; max-height: 340px; border-radius: 6px; background: ' + p.tone
      }
    };
  }
}
</script>
</body>
</html>
