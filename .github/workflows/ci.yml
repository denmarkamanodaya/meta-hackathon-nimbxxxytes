# CI: the same gates as `make gates` (tests/run-all.sh), on every push and pull request to main.
# Tests are fast and offline: no network calls to models, no cloud, no secrets.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (Rust fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System tools the tests use (tiny generated media, PDF text)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils
      - name: Rust toolchain (api/rust-toolchain.toml)
        working-directory: api
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - name: fmt
        working-directory: api
        run: cargo fmt --all --check
      - name: clippy
        working-directory: api
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        working-directory: api
        run: cargo test --workspace

  web:
    name: web (lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npm test
      - working-directory: web
        run: npm run build

  render:
    name: render (lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: render/package-lock.json
      - working-directory: render
        run: npm ci
      - working-directory: render
        run: npm run lint
      - working-directory: render
        run: npm test
      - working-directory: render
        run: npm run build

  infra:
    name: infra (terraform fmt, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.14"
      - run: terraform fmt -check -recursive infra
      - name: validate each stack
        run: |
          for s in infra/stacks/*; do
            terraform -chdir="$s" init -backend=false -input=false >/dev/null
            terraform -chdir="$s" validate
          done
