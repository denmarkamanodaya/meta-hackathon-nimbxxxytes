# Meta Model API prices in USD, read on 2026-10-27. Loaded once at start-up; every model call's
# cost row is computed from these. When a price changes, update this file.

[spark] # muse-spark-1.3, standard tier
input_per_m = 1.25
output_per_m = 4.25
cached_input_per_m = 0.15

[sam] # sam-3.1 video: every frame is billed, at least 50 per request
per_1000_frames = 0.20
min_frames = 50

[transcribe] # muse-voice-transcribe-1.0, metered per second
per_hour = 0.18

[image] # muse-image-1.0, flat per generated image
per_image = 0.01

[sam_image] # sam-3.1 on a single image, billed per image
per_1000_images = 2.50
