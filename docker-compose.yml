services:
  api:
    build:
      context: ./api
    env_file: .env
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite:///data/nimbytes.db
      PE_MODEL_DIR: /models/pe
    volumes:
      - ./data:/data
      - ./api/models:/models:ro
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/dist:/srv:ro
      - caddy_data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
