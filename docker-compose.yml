services:
  api:
    image: nimbytes-api
    build:
      context: ./api
    env_file: .env
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite:///data/nimbytes.db
      PE_MODEL_DIR: /models/pe
      RENDERER_URL: http://renderer:3001
    volumes:
      - ./data:/data
      - ./api/models:/models:ro
    restart: unless-stopped

  # Remotion renderer: POST /render on the compose network only (no published port).
  renderer:
    image: nimbytes-renderer
    build:
      context: ./render
    environment:
      PORT: "3001"
      RENDER_TIMEOUT_MS: "180000"
    expose:
      - "3001"
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/dist:/srv:ro
      - caddy_data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
